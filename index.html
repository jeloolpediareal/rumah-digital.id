<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05080f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Rumah Digital - Login</title>
  <link rel="icon" href="logo.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-wrap">
    <img src="logo.png" alt="Rumah Digital" class="auth-logo">
    <div class="auth-title">RUMAH DIGITAL</div>
    <div class="auth-sub">Mining Crypto | Powering The Future</div>

    <div class="auth-card">
      <div class="tabs">
        <button type="button" class="tab-btn active" data-tab="login">Masuk</button>
        <button type="button" class="tab-btn" data-tab="register">Daftar</button>
      </div>

      <!-- Login -->
      <form id="loginForm">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="loginUser" placeholder="Masukkan username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPass" placeholder="Masukkan password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary">Masuk</button>
        <div id="loginMsg" class="msg"></div>
      </form>

      <!-- Register -->
      <form id="registerForm" class="hidden">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="regUser" placeholder="Buat username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPass" placeholder="Buat password" required autocomplete="new-password">
        </div>
        <div class="form-group">
          <label>Pilih Server Mining</label>
          <select id="regServer" required></select>
        </div>
        <button type="submit" class="btn btn-primary">Daftar Sekarang</button>
        <div id="regMsg" class="msg"></div>
      </form>
    </div>
  </div>

  <script src="data.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
    // Redirect if already logged in
    (function() {
      const user = getCurrentUser();
      if (user) {
        window.location.replace('dashboard.html');
      }
    })();

    // Tabs
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const tab = btn.dataset.tab;
        document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
        document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
      });
    });

    // Load servers for register
    function loadServers() {
      const sel = document.getElementById('regServer');
      const servers = getServers().filter(s => s.status === 'active');
      sel.innerHTML = '';
      if (servers.length === 0) {
        sel.innerHTML = '<option value="">Tidak ada server tersedia</option>';
        return;
      }
      servers.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = s.name + ' (' + formatUSD(s.rate) + '/tick)';
        sel.appendChild(opt);
      });
    }
    loadServers();

    function showMsg(el, text, type) {
      el.textContent = text;
      el.className = 'msg show ' + type;
    }

    // Login
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('loginUser').value.trim();
      const password = document.getElementById('loginPass').value;
      const msg = document.getElementById('loginMsg');
      const user = findUser(username);
      if (!user || user.password !== password) {
        showMsg(msg, 'Username atau password salah', 'error');
        return;
      }
      setSession(user.id);
      updateUser(user.id, { lastActive: new Date().toISOString() });
      showMsg(msg, 'Berhasil masuk...', 'success');
      setTimeout(() => window.location.replace('dashboard.html'), 600);
    });

    // Register
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('regUser').value.trim();
      const password = document.getElementById('regPass').value;
      const serverId = document.getElementById('regServer').value;
      const msg = document.getElementById('regMsg');

      if (username.length < 3) {
        showMsg(msg, 'Username minimal 3 karakter', 'error');
        return;
      }
      if (password.length < 4) {
        showMsg(msg, 'Password minimal 4 karakter', 'error');
        return;
      }
      if (!serverId) {
        showMsg(msg, 'Pilih server mining terlebih dahulu', 'error');
        return;
      }

      const result = createUser(username, password, serverId);
      if (!result.ok) {
        showMsg(msg, result.msg, 'error');
        return;
      }
      setSession(result.user.id);
      showMsg(msg, 'Pendaftaran berhasil!', 'success');
      setTimeout(() => window.location.replace('dashboard.html'), 600);
    });
  </script>
</body>
</html>
