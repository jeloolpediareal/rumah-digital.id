<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05080f">
  <title>Riwayat Withdraw - Rumah Digital</title>
  <link rel="icon" href="logo.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <img src="logo.png" alt="RD">
    <div class="title-block">
      <h1>Riwayat</h1>
      <div class="sub">Riwayat Penarikan</div>
    </div>
    <button class="logout-btn" id="logoutBtn">Keluar</button>
  </header>

  <main class="app-main">
    <div class="card">
      <div class="card-title">Daftar Penarikan</div>
      <div id="historyList"></div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="home.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1V9.5z"/></svg>
      <span>Home</span>
    </a>
    <a href="dashboard.html" class="nav-item">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span>Dashboard</span>
    </a>
    <a href="withdraw.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M12 2v14m0 0l-5-5m5 5l5-5"/><path d="M5 20h14"/></svg>
      <span>Withdraw</span>
    </a>
    <a href="riwayat.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span>Riwayat</span>
    </a>
  </nav>

  <script src="data.js"></script>
  <script>
    const user = getCurrentUser();
    if (!user) window.location.replace('index.html');

    const list = document.getElementById('historyList');
    const items = getUserWithdrawals(user.id);

    if (items.length === 0) {
      list.innerHTML = '<div class="empty-state">Belum ada riwayat penarikan</div>';
    } else {
      items.forEach(w => {
        const el = document.createElement('div');
        el.className = 'list-item';
        const date = new Date(w.createdAt).toLocaleString('id-ID');
        el.innerHTML = `
          <div>
            <div style="font-weight:600;">${formatUSD(w.amountUSD)}</div>
            <div style="font-size:11px;color:var(--text-muted);">${date} · ${w.method}</div>
            <div style="font-size:11px;color:var(--text-muted);">${w.details}</div>
          </div>
          <span class="badge badge-${w.status === 'pending' ? 'pending' : w.status === 'success' ? 'success' : 'failed'}">${w.status}</span>
        `;
        list.appendChild(el);
      });
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
      clearSession();
      window.location.replace('index.html');
    });
  </script>
</body>
</html>
