<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e17">
  <title>Riwayat Withdraw - Rumah Digital</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="logo.png">
</head>
<body>
  <header class="app-header">
    <div class="logo-wrap">
      <img src="logo.png" alt="RD">
      <div class="brand">RUMAH <span>DIGITAL</span></div>
    </div>
    <div class="user-badge" id="header-user"></div>
  </header>

  <main class="page-content">
    <h1 class="page-title"> Riwayat Withdraw</h1>

    <div class="card" id="history-list">
      <!-- filled by JS -->
    </div>
  </main>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <a href="home.html" class="nav-item" data-page="home">
      <div class="icon-wrap">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </div>
      Home
    </a>
    <a href="dashboard.html" class="nav-item" data-page="dashboard">
      <div class="icon-wrap">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      </div>
      Dashboard
    </a>
    <a href="withdraw.html" class="nav-item" data-page="withdraw">
      <div class="icon-wrap">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
      </div>
      Withdraw
    </a>
    <a href="riwayat.html" class="nav-item" data-page="riwayat">
      <div class="icon-wrap">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>
      Riwayat
    </a>
  </nav>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = App.requireAuth();
      if (!user) return;

      App.setActiveNav('riwayat');
      App.updateHeaderUser(user);

      const list = document.getElementById('history-list');
      const history = user.withdrawHistory || [];

      if (history.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="icon"></div>
            <p>Belum ada riwayat penarikan</p>
          </div>
        `;
        return;
      }

      list.innerHTML = history.map(h => {
        const date = new Date(h.createdAt).toLocaleString('id-ID', {
          day: '2-digit', month: 'short', year: 'numeric',
          hour: '2-digit', minute: '2-digit'
        });
        const statusClass = h.status === 'success' ? 'status-success' :
                            h.status === 'failed' ? 'status-failed' : 'status-pending';
        const statusText = h.status === 'success' ? 'Berhasil' :
                           h.status === 'failed' ? 'Gagal' : 'Pending';
        return `
          <div class="history-item">
            <div class="left">
              <h4>${h.method} • ${h.name}</h4>
              <span>${h.account} · ${date}</span>
              <div class="status ${statusClass}">${statusText}</div>
            </div>
            <div class="amount">-$${Number(h.amount).toFixed(2)}</div>
          </div>
        `;
      }).join('');
    });
  </script>
</body>
</html>
