<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0e17">
  <title>Riwayat Withdraw - Rumah Digital</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="logo.png" type="image/png">
</head>
<body>
  <header class="app-header">
    <img src="logo.png" alt="RD" class="logo-mini">
    <span class="page-title">Riwayat</span>
    <span class="user-chip" id="headerUser">-</span>
  </header>

  <main class="app-content">
    <div class="card">
      <div class="card-title">Riwayat Penarikan</div>
      <div id="historyList" class="mt-8"></div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="home.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>
      <span>Home</span>
    </a>
    <a href="dashboard.html" class="nav-item">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span>Dashboard</span>
    </a>
    <a href="withdraw.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M12 2v14M12 16l-5-5M12 16l5-5"/><path d="M5 20h14"/></svg>
      <span>Withdraw</span>
    </a>
    <a href="riwayat.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      <span>Riwayat</span>
    </a>
  </nav>

  <script src="data.js"></script>
  <script>
    const user = requireAuth();
    if (!user) throw new Error('Not authenticated');

    document.getElementById('headerUser').textContent = user.username;

    const list = document.getElementById('historyList');
    const records = getWithdrawals(user.id);

    if (records.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity:0.4">
            <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>
          </svg>
          <p>Belum ada riwayat penarikan</p>
        </div>
      `;
    } else {
      list.innerHTML = records.map(r => {
        const date = new Date(r.createdAt).toLocaleString('id-ID', {
          day: '2-digit', month: 'short', year: 'numeric',
          hour: '2-digit', minute: '2-digit'
        });
        const statusClass = r.status === 'success' ? 'status-success' :
                            r.status === 'failed' ? 'status-failed' : 'status-pending';
        const statusLabel = r.status === 'success' ? 'Berhasil' :
                            r.status === 'failed' ? 'Gagal' : 'Pending';
        return `
          <div class="history-item">
            <div class="info">
              <span class="amount">${formatUsd(r.amount)}</span>
              <span class="date">${date} · ${r.method.toUpperCase()}</span>
              <span class="date">${r.account} · ${r.name}</span>
            </div>
            <span class="status ${statusClass}">${statusLabel}</span>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
