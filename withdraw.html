<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05080f">
  <title>Withdraw - Rumah Digital</title>
  <link rel="icon" href="logo.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <img src="logo.png" alt="RD">
    <div class="title-block">
      <h1>Withdraw</h1>
      <div class="sub">Penarikan Dana</div>
    </div>
    <button class="logout-btn" id="logoutBtn">Keluar</button>
  </header>

  <main class="app-main">
    <div class="card balance-card">
      <div class="username">Saldo Tersedia</div>
      <div class="balance-usd" id="balanceUSD">$0.0000</div>
      <div class="balance-idr" id="balanceIDR">Rp 0</div>
    </div>

    <div id="lockedMsg" class="card hidden">
      <div class="text-center" style="padding:20px 0;">
        <div style="font-size:15px;font-weight:600;margin-bottom:8px;">Fitur Withdraw Terkunci</div>
        <div style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">
          Capai saldo $10 lalu bayar unlock $5 di Dashboard untuk membuka fitur ini.
        </div>
        <a href="dashboard.html" class="btn btn-primary">Ke Dashboard</a>
      </div>
    </div>

    <div id="withdrawForm" class="card hidden">
      <div class="card-title">Form Penarikan</div>
      <div class="form-group">
        <label>Jumlah (USD)</label>
        <input type="number" id="wdAmount" step="0.01" min="1" placeholder="Minimal $1">
      </div>
      <div class="form-group">
        <label>Metode</label>
        <select id="wdMethod">
          <option value="bank">Transfer Bank</option>
          <option value="ewallet">E-Wallet</option>
          <option value="crypto">Crypto Wallet</option>
        </select>
      </div>
      <div class="form-group">
        <label>Detail Rekening / Wallet</label>
        <input type="text" id="wdDetails" placeholder="No. rekening / nomor e-wallet / address">
      </div>
      <button class="btn btn-primary" id="submitWd">Ajukan Penarikan</button>
      <div id="wdMsg" class="msg"></div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="home.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1V9.5z"/></svg>
      <span>Home</span>
    </a>
    <a href="dashboard.html" class="nav-item">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span>Dashboard</span>
    </a>
    <a href="withdraw.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M12 2v14m0 0l-5-5m5 5l5-5"/><path d="M5 20h14"/></svg>
      <span>Withdraw</span>
    </a>
    <a href="riwayat.html" class="nav-item">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span>Riwayat</span>
    </a>
  </nav>

  <script src="data.js"></script>
  <script>
    let user = getCurrentUser();
    if (!user) window.location.replace('index.html');

    function refresh() {
      user = getCurrentUser();
      document.getElementById('balanceUSD').textContent = formatUSD(user.balance);
      document.getElementById('balanceIDR').textContent = formatIDR(toIDR(user.balance));

      if (user.unlockedWithdraw) {
        document.getElementById('lockedMsg').classList.add('hidden');
        document.getElementById('withdrawForm').classList.remove('hidden');
      } else {
        document.getElementById('lockedMsg').classList.remove('hidden');
        document.getElementById('withdrawForm').classList.add('hidden');
      }
    }
    refresh();

    document.getElementById('submitWd').addEventListener('click', () => {
      const amount = parseFloat(document.getElementById('wdAmount').value);
      const method = document.getElementById('wdMethod').value;
      const details = document.getElementById('wdDetails').value.trim();
      const msg = document.getElementById('wdMsg');

      if (!amount || amount < 1) {
        msg.className = 'msg show error';
        msg.textContent = 'Minimal penarikan $1';
        return;
      }
      if (amount > user.balance) {
        msg.className = 'msg show error';
        msg.textContent = 'Saldo tidak cukup';
        return;
      }
      if (!details) {
        msg.className = 'msg show error';
        msg.textContent = 'Isi detail rekening / wallet';
        return;
      }

      addWithdrawal(user.id, amount, method, details);
      updateUser(user.id, { balance: user.balance - amount });
      refresh();
      msg.className = 'msg show success';
      msg.textContent = 'Penarikan berhasil diajukan. Cek Riwayat.';
      document.getElementById('wdAmount').value = '';
      document.getElementById('wdDetails').value = '';
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      clearSession();
      window.location.replace('index.html');
    });
  </script>
</body>
</html>
