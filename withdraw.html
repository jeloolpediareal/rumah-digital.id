<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0e17">
  <title>Withdraw - Rumah Digital</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="logo.png" type="image/png">
</head>
<body>
  <header class="app-header">
    <img src="logo.png" alt="RD" class="logo-mini">
    <span class="page-title">Withdraw</span>
    <span class="user-chip" id="headerUser">-</span>
  </header>

  <main class="app-content">
    <div class="card balance-card">
      <div class="balance-label">Saldo Tersedia</div>
      <div class="balance-usd" id="balanceUsd">$0.0000</div>
      <div class="balance-idr" id="balanceIdr">Rp 0</div>
    </div>

    <div id="lockedPanel" class="card hidden">
      <div class="card-title">Fitur Terkunci</div>
      <p style="color:var(--text-secondary);margin-top:10px;font-size:0.9rem">
        Fitur withdraw masih terkunci. Capai saldo minimum $10 lalu aktifkan dengan pembayaran QRIS di halaman Dashboard.
      </p>
      <a href="dashboard.html" class="btn btn-primary mt-16">Ke Dashboard</a>
    </div>

    <div id="withdrawPanel" class="card hidden">
      <div class="card-title">Form Penarikan</div>
      <div id="alertBox" class="alert mt-8"></div>
      <form id="withdrawForm" class="withdraw-form mt-8">
        <div class="form-group">
          <label for="wdAmount">Jumlah (USD)</label>
          <input type="number" id="wdAmount" step="0.0001" min="0.01" placeholder="0.00" required>
        </div>
        <div class="form-group">
          <label for="wdMethod">Metode</label>
          <select id="wdMethod" required>
            <option value="bank">Transfer Bank</option>
            <option value="dana">DANA</option>
            <option value="gopay">GoPay</option>
            <option value="ovo">OVO</option>
            <option value="shopeepay">ShopeePay</option>
          </select>
        </div>
        <div class="form-group">
          <label for="wdAccount">Nomor Rekening / E-Wallet</label>
          <input type="text" id="wdAccount" placeholder="Nomor rekening atau e-wallet" required>
        </div>
        <div class="form-group">
          <label for="wdName">Nama Pemilik</label>
          <input type="text" id="wdName" placeholder="Nama sesuai rekening" required>
        </div>
        <button type="submit" class="btn btn-primary" id="btnSubmit">Ajukan Penarikan</button>
      </form>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="home.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>
      <span>Home</span>
    </a>
    <a href="dashboard.html" class="nav-item">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span>Dashboard</span>
    </a>
    <a href="withdraw.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M12 2v14M12 16l-5-5M12 16l5-5"/><path d="M5 20h14"/></svg>
      <span>Withdraw</span>
    </a>
    <a href="riwayat.html" class="nav-item">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      <span>Riwayat</span>
    </a>
  </nav>

  <script src="data.js"></script>
  <script>
    const user = requireAuth();
    if (!user) throw new Error('Not authenticated');

    const settings = getSettings();
    const USD_TO_IDR = settings.usdToIdr;

    let currentUser = user;

    function refresh() {
      currentUser = getCurrentUser();
      if (!currentUser) {
        window.location.href = 'index.html';
        return;
      }
      document.getElementById('headerUser').textContent = currentUser.username;
      document.getElementById('balanceUsd').textContent = formatUsd(currentUser.balance);
      document.getElementById('balanceIdr').textContent = formatIdr(currentUser.balance, USD_TO_IDR);

      if (currentUser.unlocked) {
        document.getElementById('lockedPanel').classList.add('hidden');
        document.getElementById('withdrawPanel').classList.remove('hidden');
      } else {
        document.getElementById('lockedPanel').classList.remove('hidden');
        document.getElementById('withdrawPanel').classList.add('hidden');
      }
    }

    const alertBox = document.getElementById('alertBox');
    function showAlert(msg, type = 'error') {
      alertBox.textContent = msg;
      alertBox.className = 'alert show alert-' + type;
    }

    document.getElementById('withdrawForm').addEventListener('submit', (e) => {
      e.preventDefault();
      refresh();
      const amount = parseFloat(document.getElementById('wdAmount').value);
      const method = document.getElementById('wdMethod').value;
      const account = document.getElementById('wdAccount').value.trim();
      const name = document.getElementById('wdName').value.trim();

      if (isNaN(amount) || amount <= 0) {
        showAlert('Jumlah tidak valid');
        return;
      }
      if (amount > currentUser.balance) {
        showAlert('Saldo tidak mencukupi');
        return;
      }
      if (amount < 0.01) {
        showAlert('Minimum penarikan $0.01');
        return;
      }

      currentUser.balance = Number((currentUser.balance - amount).toFixed(6));
      updateUser(currentUser);

      const record = {
        id: 'wd_' + Date.now(),
        amount: amount,
        method: method,
        account: account,
        name: name,
        status: 'pending',
        createdAt: new Date().toISOString()
      };
      addWithdrawal(currentUser.id, record);

      showAlert('Penarikan berhasil diajukan. Status: Pending', 'success');
      document.getElementById('withdrawForm').reset();
      refresh();
    });

    refresh();
  </script>
</body>
</html>
