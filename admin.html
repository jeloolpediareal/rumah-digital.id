<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05080f">
  <title>Admin Panel - Rumah Digital</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loginScreen" class="auth-wrap">
    <img src="logo.png" alt="RD" class="auth-logo" style="width:100px;">
    <div class="auth-title">ADMIN PANEL</div>
    <div class="auth-sub">Rumah Digital Control Center</div>
    <div class="auth-card">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="adminUser" placeholder="Username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="adminPass" placeholder="Password">
      </div>
      <button class="btn btn-primary" id="adminLoginBtn">Masuk Admin</button>
      <div id="adminLoginMsg" class="msg"></div>
    </div>
  </div>

  <div id="adminPanel" class="hidden">
    <header class="app-header">
      <img src="logo.png" alt="RD">
      <div class="title-block">
        <h1>Admin Panel</h1>
        <div class="sub">Control Center</div>
      </div>
      <button class="logout-btn" id="adminLogout">Keluar</button>
    </header>

    <main class="app-main" style="padding-bottom:40px;">
      <div class="admin-grid">
        <div class="admin-stat">
          <div class="num" id="totalUsers">0</div>
          <div class="lbl">Total Pengguna</div>
        </div>
        <div class="admin-stat">
          <div class="num" id="onlineUsers">0</div>
          <div class="lbl">Sedang Mining</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Kontrol Server Global</div>
        <div class="server-status mb-12" id="globalStatus">
          <div class="status-dot online" id="gDot"></div>
          <div class="status-text" id="gText">Server Online Live</div>
        </div>
        <div class="admin-actions">
          <button class="btn btn-success" id="btnOnline">Online Server</button>
          <button class="btn btn-danger" id="btnClose">Close Server</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Tambah Server Mining</div>
        <div class="form-group">
          <label>Nama Server</label>
          <input type="text" id="newSrvName" placeholder="Contoh: Delta Node">
        </div>
        <div class="form-group">
          <label>Rate per Tick (USD setiap 5 detik)</label>
          <input type="number" id="newSrvRate" step="0.01" min="0.001" placeholder="0.03">
        </div>
        <button class="btn btn-primary" id="btnAddSrv">Tambah Server</button>
        <div id="addSrvMsg" class="msg"></div>
      </div>

      <div class="card">
        <div class="card-title">Daftar Server</div>
        <div id="srvListAdmin"></div>
      </div>

      <div class="card">
        <div class="card-title">Status Pengguna</div>
        <div id="userListAdmin"></div>
      </div>
    </main>
  </div>

  <script src="data.js"></script>
  <script>
    const ADMIN_USER = 'Jelool';
    const ADMIN_PASS = 'Jelool';

    function showPanel() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('adminPanel').classList.remove('hidden');
      renderAll();
    }

    document.getElementById('adminLoginBtn').addEventListener('click', () => {
      const u = document.getElementById('adminUser').value.trim();
      const p = document.getElementById('adminPass').value;
      const msg = document.getElementById('adminLoginMsg');
      if (u === ADMIN_USER && p === ADMIN_PASS) {
        sessionStorage.setItem('rd_admin', '1');
        showPanel();
      } else {
        msg.className = 'msg show error';
        msg.textContent = 'Username atau password salah';
      }
    });

    if (sessionStorage.getItem('rd_admin') === '1') showPanel();

    document.getElementById('adminLogout').addEventListener('click', () => {
      sessionStorage.removeItem('rd_admin');
      location.reload();
    });

    function renderGlobal() {
      const g = getGlobal();
      const dot = document.getElementById('gDot');
      const txt = document.getElementById('gText');
      if (g.serverOnline) {
        dot.className = 'status-dot online';
        txt.textContent = 'Server Online Live';
      } else {
        dot.className = 'status-dot offline';
        txt.textContent = 'Server Maintenance';
      }
    }

    document.getElementById('btnOnline').addEventListener('click', () => {
      setServerOnline(true);
      renderGlobal();
    });
    document.getElementById('btnClose').addEventListener('click', () => {
      setServerOnline(false);
      renderGlobal();
    });

    document.getElementById('btnAddSrv').addEventListener('click', () => {
      const name = document.getElementById('newSrvName').value.trim();
      const rate = parseFloat(document.getElementById('newSrvRate').value);
      const msg = document.getElementById('addSrvMsg');
      if (!name || !rate || rate <= 0) {
        msg.className = 'msg show error';
        msg.textContent = 'Isi nama dan rate dengan benar';
        return;
      }
      addServer(name, rate);
      document.getElementById('newSrvName').value = '';
      document.getElementById('newSrvRate').value = '';
      msg.className = 'msg show success';
      msg.textContent = 'Server berhasil ditambahkan';
      renderServersAdmin();
    });

    function renderServersAdmin() {
      const box = document.getElementById('srvListAdmin');
      const servers = getServers();
      box.innerHTML = '';
      servers.forEach(s => {
        const el = document.createElement('div');
        el.className = 'list-item';
        el.innerHTML = `
          <div>
            <div style="font-weight:600;">${s.name}</div>
            <div style="font-size:12px;color:var(--cyan);">${formatUSD(s.rate)} / tick</div>
          </div>
          <span style="font-size:12px;color:var(--text-muted);">${s.status}</span>
        `;
        box.appendChild(el);
      });
    }

    function renderUsers() {
      const users = getUsers();
      document.getElementById('totalUsers').textContent = users.length;

      const now = Date.now();
      let miningCount = 0;
      const box = document.getElementById('userListAdmin');
      box.innerHTML = '';

      if (users.length === 0) {
        box.innerHTML = '<div class="empty-state">Belum ada pengguna</div>';
        document.getElementById('onlineUsers').textContent = '0';
        return;
      }

      users.forEach(u => {
        const last = u.lastMineAt ? new Date(u.lastMineAt).getTime() : 0;
        const isMining = (now - last) < 30000; // aktif 30 detik terakhir
        if (isMining) miningCount++;
        const srv = getServers().find(s => s.id === u.selectedServer);
        const el = document.createElement('div');
        el.className = 'list-item';
        el.innerHTML = `
          <div>
            <div style="font-weight:600;">@${u.username}</div>
            <div style="font-size:11px;color:var(--text-muted);">${formatUSD(u.balance)} · ${srv ? srv.name : '-'}</div>
          </div>
          <span class="badge ${isMining ? 'badge-success' : 'badge-pending'}">${isMining ? 'Mining' : 'Idle'}</span>
        `;
        box.appendChild(el);
      });
      document.getElementById('onlineUsers').textContent = miningCount;
    }

    function renderAll() {
      renderGlobal();
      renderServersAdmin();
      renderUsers();
    }

    setInterval(() => {
      if (sessionStorage.getItem('rd_admin') === '1') renderUsers();
    }, 10000);
  </script>
</body>
</html>
