<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070b14"><title>Admin Panel • Rumah Digital</title>
<link rel="stylesheet" href="style.css"><link rel="icon" href="logo.png">
<style>
.admin-page{max-width:1100px;margin:auto;padding:28px 16px 60px}
.admin-top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}
.admin-brand{display:flex;align-items:center;gap:12px}.admin-brand img{width:46px;height:46px;filter:drop-shadow(0 0 12px rgba(0,229,255,.35))}
.admin-brand h1{font-size:1.25rem}.admin-brand small{display:block;color:var(--text-muted);margin-top:3px}
.admin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat-card{padding:18px;border:1px solid var(--border);background:linear-gradient(145deg,rgba(17,24,39,.98),rgba(10,14,23,.95));border-radius:18px}
.stat-card .emoji{font-size:1.5rem}.stat-card b{display:block;font-size:1.5rem;margin-top:8px}.stat-card span{font-size:.78rem;color:var(--text-muted)}
.admin-columns{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.server-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}
.server-row:last-child{border-bottom:0}.server-meta strong{display:block}.server-meta span{font-size:.8rem;color:var(--text-muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}.mini{padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer}.mini.danger{border-color:rgba(239,68,68,.5);color:#fecaca}.mini.good{border-color:rgba(34,197,94,.5);color:#bbf7d0}
.table-wrap{overflow:auto}.user-table{width:100%;border-collapse:collapse;font-size:.84rem}.user-table th,.user-table td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--border);white-space:nowrap}.user-table th{color:var(--text-muted);font-weight:600}
.login-overlay{position:fixed;inset:0;background:radial-gradient(circle at top,#0b2030,#05070c 65%);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}.admin-login{width:min(390px,100%);padding:26px}.hidden{display:none!important}
@media(max-width:800px){.admin-grid{grid-template-columns:repeat(2,1fr)}.admin-columns{grid-template-columns:1fr}.admin-top{align-items:flex-start}}
</style>
</head>
<body>
<div id="login-overlay" class="login-overlay">
  <form class="auth-card admin-login" id="admin-login">
    <div style="text-align:center;font-size:2.4rem">️</div><h2 style="text-align:center;margin:8px 0">Admin Console</h2>
    <p style="text-align:center;color:var(--text-muted);font-size:.85rem;margin-bottom:20px">Kelola server mining dan monitor pengguna.</p>
    <div id="admin-alert" class="alert"></div>
    <div class="form-group"><label>Username Admin</label><input id="admin-user" required autocomplete="username"></div>
    <div class="form-group"><label>Password</label><input id="admin-pass" type="password" required autocomplete="current-password"></div>
    <button class="btn btn-primary"> Masuk Panel</button>
  </form>
</div>
<main class="admin-page hidden" id="panel">
  <div class="admin-top">
    <div class="admin-brand"><img src="logo.png"><div><h1>RUMAH DIGITAL • ADMIN</h1><small> Mining Control Center</small></div></div>
    <button class="mini" id="admin-logout">Keluar ↗</button>
  </div>
  <section class="admin-grid">
    <div class="stat-card"><div class="emoji"></div><b id="total-users">0</b><span>Total Pengguna</span></div>
    <div class="stat-card"><div class="emoji"></div><b id="online-users">0</b><span>Online / Mining</span></div>
    <div class="stat-card"><div class="emoji">️</div><b id="mining-users">0</b><span>Sedang Menambang</span></div>
    <div class="stat-card"><div class="emoji">️</div><b id="server-count">0</b><span>Server Aktif</span></div>
  </section>
  <div class="admin-columns">
    <section class="card"><div class="card-title">️ Kontrol Server</div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px">
        <span id="global-status">Status Server</span><button class="mini" id="global-toggle"></button>
      </div>
      <div id="server-list"></div>
      <form id="add-server" style="margin-top:18px;padding-top:18px;border-top:1px solid var(--border)">
        <div class="card-title"> Tambah Server</div>
        <div class="form-group"><label>Nama Server</label><input id="server-name" placeholder="Aurora Hash #03" required></div>
        <div class="form-group"><label>Dollar per detik/tick</label><input id="server-rate" type="number" min="0" step="0.0001" placeholder="0.1200" required></div>
        <div class="form-group"><label>Interval mining (detik)</label><input id="server-interval" type="number" min="1" value="5" required></div>
        <button class="btn btn-primary"> Simpan Server</button>
      </form>
    </section>
    <section class="card"><div class="card-title"> Status Pengguna</div>
      <div class="table-wrap"><table class="user-table"><thead><tr><th>User</th><th>Server</th><th>Status</th><th>Saldo</th></tr></thead><tbody id="users-body"></tbody></table></div>
    </section>
  </div>
</main>
<script src="data.js"></script><script src="admin.js"></script>
</body></html>
